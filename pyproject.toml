[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "genestore"
readme = "README.md"
description = "Python bindings for genegraph-storage. Store your numpy data in Lance format"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["vector-search", "spectral-analysis", "graph-signal", "similarity-search", "machine-learning"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database :: Front-Ends",  # for vector DB/search integrations
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",  # valid trove classifier via trove-classifiers set
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "numpy>=2.0",
    "pyarrow>=20",
    "scipy>=1.14",
]

[project.urls]
Homepage = "https://github.com/tuned-org-uk/pygenestore"
Repository = "https://github.com/tuned-org-uk/pygenestore.git"

[tool.maturin]
features = ["pyo3/extension-module"]

exclude = [
    "tests/",
    "lance_data/*",
    ".github/",
    "**/*.pyc",
    ".gitignore"
]
